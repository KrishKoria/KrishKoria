<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Krish Koria, AI Engineer">
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="#fefcf4" stroke="#e2dccb" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" letter-spacing="3" fill="#b8741a">
    <text x="64" y="86">AI ENGINEER · INDIA</text>
  </g>
  <text x="62" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#1b1914" letter-spacing="-1.5">Krish Koria</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#6b6558">
    <text x="64" y="198">I build LLM agents, and the evaluation and</text>
    <text x="64" y="228">tracing that tell you when to trust them.</text>
  </g>
  <text x="64" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#1b1914" opacity="0.85">Python · LangGraph · Databricks · MLflow · FastAPI · Next.js</text>

  <rect x="740" y="56" width="400" height="222" rx="12" fill="#f3efe2" stroke="#e2dccb"/>
  <circle cx="764" cy="80" r="5" fill="#e2dccb"/><circle cx="782" cy="80" r="5" fill="#e2dccb"/><circle cx="800" cy="80" r="5" fill="#e2dccb"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15">
    <text x="764" y="126"><tspan fill="#b8741a">$</tspan><tspan fill="#1b1914"> eval --judges sonnet,gpt,gemini</tspan></text>
    <text x="764" y="168" fill="#6b6558">questions</text><text x="930" y="168" fill="#1b1914">1,000+</text><text x="764" y="198" fill="#6b6558">groundedness</text><text x="930" y="198" fill="#1b1914">87% → 97%</text><text x="764" y="228" fill="#6b6558">cost / 100 q</text><text x="930" y="228" fill="#1b1914">~$0.30</text><text x="764" y="258" fill="#6b6558">verdict</text><text x="930" y="258" fill="#2f7d32">✓ pass</text>
  </g>
  <rect x="990" y="243" width="9" height="17" fill="#b8741a">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
